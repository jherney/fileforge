<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileForge — Convert your files</title>
<style>
  :root {
    --bg: #0d1017;
    --panel: #151a24;
    --panel-2: #1b2130;
    --line: #2a3245;
    --text: #e8ecf4;
    --muted: #8a94a8;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: dark; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    background: radial-gradient(1200px 700px at 80% -10%, #1c2440 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 60px;
  }
  header { text-align: center; margin-bottom: 34px; }
  .logo {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); margin-top: 6px; }
  main { width: 100%; max-width: 620px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  /* drop zone */
  #drop {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 46px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: rgba(91,140,255,.06); }
  #drop .big { font-size: 17px; font-weight: 600; }
  #drop .small { color: var(--muted); margin-top: 6px; font-size: 13px; }
  #file { display: none; }

  .filechip {
    display: none; align-items: center; gap: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin-top: 16px;
  }
  .filechip.show { display: flex; }
  .filechip .ext {
    font-weight: 800; font-size: 12px; letter-spacing: .5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 8px; padding: 8px 9px; color: #fff; text-transform: uppercase;
  }
  .filechip .meta { flex: 1; min-width: 0; }
  .filechip .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filechip .size { color: var(--muted); font-size: 12.5px; }
  .filechip .x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .filechip .x:hover { color: var(--err); }

  /* conversion row */
  .convert-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .fmt {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: 600;
    appearance: none; -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%238a94a8" stroke-width="2" fill="none" stroke-linecap="round"/></svg>');
    background-repeat: no-repeat; background-position: right 14px center;
    cursor: pointer;
  }
  .arrow { color: var(--accent); font-size: 22px; flex: 0 0 auto; }

  button.go {
    width: 100%; margin-top: 18px; padding: 14px;
    font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity .15s, transform .05s;
  }
  button.go:hover { opacity: .92; }
  button.go:active { transform: scale(.995); }
  button.go:disabled { opacity: .45; cursor: not-allowed; }

  .status { margin-top: 14px; min-height: 22px; font-size: 14px; text-align: center; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px;
    border: 2px solid rgba(255,255,255,.25); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .available { margin-top: 22px; color: var(--muted); font-size: 13px; text-align: center; }
  .available .pill {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; margin: 3px; font-size: 12.5px; color: var(--text);
  }
  footer { margin-top: 26px; color: var(--muted); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">FileForge</div>
  <div class="tagline">Convert documents in your browser. Files never leave this machine.</div>
</header>

<main>
  <div class="card">
    <div id="drop" role="button" tabindex="0" aria-label="Choose a file to convert, or drop one here">
      <div class="big">Drop a file here or click to browse</div>
      <div class="small" id="dropHint">PDF up to 50&nbsp;MB</div>
      <input type="file" id="file">
    </div>

    <div class="filechip" id="chip">
      <div class="ext" id="chipExt">PDF</div>
      <div class="meta">
        <div class="name" id="chipName">document.pdf</div>
        <div class="size" id="chipSize">—</div>
      </div>
      <button class="x" id="chipX" title="Remove file" aria-label="Remove file">&times;</button>
    </div>

    <div class="convert-row">
      <select class="fmt" id="fromSel" aria-label="Convert from"></select>
      <div class="arrow">&#8594;</div>
      <select class="fmt" id="toSel" aria-label="Convert to"></select>
    </div>

    <button class="go" id="go" disabled>Convert</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="available" id="available"></div>
  <footer>Runs locally · nothing is uploaded to the internet</footer>
</main>

<script src="app.js"></script>
</body>
</html>
